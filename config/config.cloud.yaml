# Cloud-hosted configuration (Render deployment).
# No Ollama on hosted infra -> deterministic fake adapter keeps the demo self-contained.

target:
  type: "fake"
  model_id: "fake-llm-v1"
  temperature: 0.0

embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"

reference:
  window_size: 50
  auto_create: true
  min_runs: 10

monitoring:
  batch_size: 10
  random_seed: 42
  run_category_tests: true
  category_window_cycles: 5
  min_samples_per_category: 8

alerts:
  significance_threshold: 0.05
  quality_degradation_threshold: 0.3
  min_sample_size: 10
  min_consecutive_cycles: 2
  use_alpha_spending: false
  planning_horizon_cycles: 30

data:
  # Seeded demo database (committed); run probes extend it live at runtime.
  db_path: "data/seed_drift.db"

dashboard:
  port: 8501
  host: "0.0.0.0"
